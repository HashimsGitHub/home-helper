<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#176b5b">

  <link rel="manifest" href="/manifest.webmanifest">

  <title>Home Helper</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div id="app">
    <iframe
      src="https://homelist.streamlit.app/?embed=true&embed_options=show_toolbar=false"
      title="Home Helper"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/sw.js")
          .catch((error) => {
            console.error(
              "Service Worker registration failed:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
